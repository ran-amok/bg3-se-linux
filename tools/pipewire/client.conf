# Client config file for PipeWire version "1.6.8" #
#
# bg3-se-linux: a verbatim copy of /usr/share/pipewire/client.conf (PipeWire
# 1.6.8, copied 2026-09-29) with one line added below -- module.rt = false.
# It is reached only by tools/bg3se-launch.sh exporting PIPEWIRE_CONFIG_DIR at
# this directory around its headless gamescope exec, and PIPEWIRE_CONFIG_DIR
# replaces the whole conf search (measured: the /etc drop-in directory is not
# consulted either), so nothing else on the box sees it.
#
# Because it replaces the system file rather than layering over it, a PipeWire
# upgrade does not reach it: re-copy /usr/share/pipewire/client.conf and re-add
# the one line if gamescope's PipeWire path starts complaining. The check is the
# isolation one-liner, which needs no game:
#
#   PIPEWIRE_CONFIG_DIR=$PWD/tools/pipewire gamescope --backend headless \
#       -W 64 -H 64 -r 5 -- sh -c 'grep "Max realtime timeout" /proc/self/limits'
#
# It must print `unlimited unlimited`; `0 0` is the broken case. (gamescope
# segfaults on teardown once its child exits; that is not a failure of the test.)
#
# Copy and edit this file in /etc/pipewire for system-wide changes
# or in ~/.config/pipewire for local changes.
#
# It is also possible to place a file with an updated section in
# /etc/pipewire/client.conf.d/ for system-wide changes or in
# ~/.config/pipewire/client.conf.d/ for local changes.
#

context.properties = {
    # bg3-se-linux: do NOT load libpipewire-module-rt in this
    # context. The module calls setrlimit(RLIMIT_RTTIME, {0,0}) from a
    # spa data-loop thread, which is per-process and inherited by every
    # descendant -- inside gamescope that means bin/bg3, whose WT/High
    # threads are then SIGKILLed by the kernel's rlimit enforcement the
    # first jiffy they spend in the RT class.
    # A hard limit cannot be raised again from below, so it has to not be set.
    # The module's own switch is its `condition = [ { module.rt = !false } ]`.
    # Scoped: this file is reached only through PIPEWIRE_CONFIG_DIR exported
    # around the gamescope exec in tools/bg3se-launch.sh, never as a drop-in
    # under ~/.config/pipewire (that would change every client on the box).
    module.rt        = false

    ## Configure properties in the system.
    #mem.warn-mlock  = false
    #mem.allow-mlock = true
    #mem.mlock-all   = false
    log.level        = 0

    #default.clock.quantum-limit = 8192
}

context.spa-libs = {
    #<factory-name regex> = <library-name>
    #
    # Used to find spa factory names. It maps an spa factory name
    # regular expression to a library name that should contain
    # that factory.
    #
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
    video.convert.* = videoconvert/libspa-videoconvert
}

context.modules = [
    #{ name = <module-name>
    #    ( args  = { <key> = <value> ... } )
    #    ( flags = [ ( ifexists ) ( nofail ) ] )
    #    ( condition = [ { <key> = <value> ... } ... ] )
    #}
    #
    # Loads a module with the given parameters.
    # If ifexists is given, the module is ignored when it is not found.
    # If nofail is given, module initialization failures are ignored.
    #
    # Uses realtime scheduling to boost the audio thread priorities
    { name = libpipewire-module-rt
        args = {
            #rt.prio      = 83
            #rt.time.soft = -1
            #rt.time.hard = -1
            #rlimits.enabled = true
            #rtportal.enabled = true
            #rtkit.enabled = true
            #uclamp.min = 0
            #uclamp.max = 1024
        }
        flags = [ ifexists nofail ]
        condition = [ { module.rt = !false } ]
    }

    # The native communication protocol.
    { name = libpipewire-module-protocol-native }

    # Allows creating nodes that run in the context of the
    # client. Is used by all clients that want to provide
    # data to PipeWire.
    { name = libpipewire-module-client-node
        condition = [ { module.client-node = !false } ]
    }

    # Allows creating devices that run in the context of the
    # client. Is used by the session manager.
    { name = libpipewire-module-client-device
        condition = [ { module.client-device = !false } ]
    }

    # Makes a factory for wrapping nodes in an adapter with a
    # converter and resampler.
    { name = libpipewire-module-adapter
        condition = [ { module.adapter = !false } ]
    }

    # Allows applications to create metadata objects. It creates
    # a factory for Metadata objects.
    { name = libpipewire-module-metadata
        condition = [ { module.metadata = !false } ]
    }

    # Provides factories to make session manager objects.
    { name = libpipewire-module-session-manager
        condition = [ { module.session-manager = !false } ]
    }
]

filter.properties = {
    #node.latency = 1024/48000
}

stream.properties = {
    #node.latency          = 1024/48000
    #node.autoconnect      = true
    #resample.quality      = 4
    #channelmix.normalize  = false
    #channelmix.mix-lfe    = true
    #channelmix.upmix      = true
    #channelmix.upmix-method = psd  # none, simple
    #channelmix.lfe-cutoff = 150
    #channelmix.fc-cutoff  = 12000
    #channelmix.rear-delay = 12.0
    #channelmix.stereo-widen = 0.0
    #channelmix.hilbert-taps = 0
    #dither.noise = 0
}

stream.rules = [
    {   matches = [
            {
                # all keys must match the value. ! negates. ~ starts regex.
                #application.name       = "pw-cat"
                #node.name 		= "~Google Chrome$"
            }
        ]
        actions = {
            update-props = {
                #node.latency = 512/48000
            }
        }
    }
]

